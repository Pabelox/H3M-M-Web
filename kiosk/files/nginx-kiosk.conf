# Lokalny serwer gry.
# Plik instalowany jako /etc/nginx/sites-available/kiosk
#
# Zbudowana gra to moduly ES (<script type="module">). Przegladarka blokuje
# je przy otwarciu z file:// przez polityke CORS, wiec pliki MUSZA byc
# serwowane po HTTP. Stad nginx na localhoscie - dziala bez internetu
# i wstaje automatycznie razem z systemem.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/kiosk;
    index index.html;

    # Gra jest w calosci statyczna - pojedyncza strona, bez API.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assety maja w nazwie skrot zawartosci, wiec moga lezec w cache na stale.
    location /assets/ {
        expires 30d;
        access_log off;
    }

    # W kiosku nikt nie zobaczy strony bledu - lepiej wrocic do gry.
    error_page 404 =200 /index.html;

    # Bez nagłowka z wersja serwera.
    server_tokens off;
}
