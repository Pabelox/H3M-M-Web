# Zwolnienie portu 53 dla dnsmasq.
# Plik instalowany jako /etc/systemd/resolved.conf.d/kiosk.conf
#
# Ubuntu 22.04 uruchamia systemd-resolved, ktory sam nasluchuje na
# 127.0.0.53:53. Bez wylaczenia jego nasluchu dnsmasq nie wystartuje
# ("failed to create listening socket: Address already in use") i cale
# filtrowanie DNS po cichu nie zadziala.

[Resolve]
DNSStubListener=no
