# Blokady na poziomie serwera X.
# Plik instalowany jako /etc/X11/xorg.conf.d/99-kiosk.conf
#
# DontVTSwitch blokuje Ctrl+Alt+F1..F12, czyli ucieczke do konsoli tekstowej.
# DontZap blokuje Ctrl+Alt+Backspace, czyli ubicie serwera X.
# Bez tych dwoch opcji tryb kiosk da sie obejsc dwoma skrotami.

Section "ServerFlags"
    Option "DontVTSwitch" "true"
    Option "DontZap"      "true"
    Option "BlankTime"    "0"
    Option "StandbyTime"  "0"
    Option "SuspendTime"  "0"
    Option "OffTime"      "0"
EndSection
