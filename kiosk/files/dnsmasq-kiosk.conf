# Filtrowanie DNS na zasadzie bialej listy.
# Plik instalowany jako /etc/dnsmasq.d/kiosk.conf
#
# Zasada: domyslnie blokujemy WSZYSTKO, a przepuszczamy tylko domeny wpisane
# nizej. dnsmasq wybiera regule najbardziej szczegolowa, wiec wpisy `server=`
# maja pierwszenstwo przed ogolnym `address=/#/`.
#
# Gra dziala w calosci lokalnie i nie potrzebuje internetu. Biala lista jest
# tu po to, zeby dzialal jedynie klikalny odnosnik do strony uczelni.

listen-address=127.0.0.1
bind-interfaces
# Nie czytaj /etc/resolv.conf - inaczej zrobilaby sie petla, bo resolv.conf
# wskazuje z powrotem na dnsmasq.
no-resolv
domain-needed
bogus-priv
cache-size=1000

# --- CZARNA LISTA (domyslna) ---
# Kazda nazwa nieobjeta biala lista rozwiazuje sie na 0.0.0.0.
address=/#/0.0.0.0

# --- BIALA LISTA ---
# Domena uczelni - odnosnik pod logo w interfejsie gry.
server=/wsi.edu.pl/1.1.1.1
server=/www.wsi.edu.pl/1.1.1.1

# Localhost musi sie rozwiazywac zawsze - to na nim stoi nginx z gra.
address=/localhost/127.0.0.1
