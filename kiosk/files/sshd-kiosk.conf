# Ograniczenie dostepu zdalnego.
# Plik instalowany jako /etc/ssh/sshd_config.d/10-kiosk.conf
#
# Zdalnie loguje sie wylacznie konto administracyjne. Konto kiosk jest
# jawnie odciete - to ono ma automatyczna sesje graficzna, wiec nie moze
# byc jednoczesnie punktem wejscia z sieci.

PermitRootLogin no
AllowUsers admin
DenyUsers kiosk
