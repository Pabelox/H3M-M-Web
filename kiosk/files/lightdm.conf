# Automatyczne logowanie uzytkownika kiosku bez ekranu powitalnego.
# Plik instalowany jako /etc/lightdm/lightdm.conf

[Seat:*]
autologin-user=kiosk
autologin-user-timeout=0
user-session=openbox
greeter-session=lightdm-gtk-greeter
# Bez przelaczania uzytkownika i bez gosc-sesji - kiosk ma jedno konto.
allow-guest=false
greeter-hide-users=true
greeter-show-manual-login=false
