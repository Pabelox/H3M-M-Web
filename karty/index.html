<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karty Bitwy — planszowa gra taktyczna</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <!-- TODO: podmienić href i grafikę na logo właściwej uczelni -->
        <a
          class="logo"
          href="https://www.example.edu.pl"
          target="_blank"
          rel="noopener noreferrer"
          title="Przejdź do strony uczelni"
        >
          <img src="assets/ui/logo-uczelni.svg" alt="Logo uczelni" />
        </a>

        <div class="titles">
          <h1>Karty Bitwy</h1>
          <p class="subtitle">Taktyka na heksach · oddziały ulepszane kartami</p>
        </div>

        <div class="status">
          <span id="round-label">Runda 1</span>
          <span id="turn-label">Tura</span>
        </div>
      </header>

      <main class="table">
        <aside class="panel" id="panel-A"></aside>

        <section class="board-area">
          <div class="initiative" id="initiative"></div>
          <canvas id="board"></canvas>
          <div class="hand" id="hand"></div>
        </section>

        <aside class="panel" id="panel-B"></aside>
      </main>

      <footer class="bottombar">
        <div class="controls">
          <button id="btn-defend" type="button">🛡 Obrona <kbd>O</kbd></button>
          <button id="btn-wait" type="button">⏳ Czekaj <kbd>C</kbd></button>
          <button id="btn-restart" type="button">⚙ Panel MG</button>
          <button id="btn-mute" type="button">🔊 Dźwięk</button>
        </div>

        <div class="dice" id="dice"></div>

        <div class="log" id="log"></div>

        <!-- Stały podpis autora wymagany przez regulamin projektu -->
        <div class="signature">
          <span class="signature-name">Imię Nazwisko</span>
          <span class="signature-index">nr albumu 000000</span>
        </div>
      </footer>

      <div class="gm" id="gm" hidden></div>

      <div class="overlay" id="overlay" hidden>
        <div class="overlay-card">
          <h2>Koniec partii</h2>
          <p id="overlay-text"></p>
          <button id="overlay-restart" type="button">Panel mistrza gry</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
